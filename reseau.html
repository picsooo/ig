<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Notre réseau · El Djazair Idjar</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/corporate.css">
</head>
<body data-page="reseau">
<script src="js/common.js"></script>

<main>
  <section class="page-tete"><div class="wrap">
    <p class="fil"><a href="index.html">Accueil</a> / Notre réseau</p>
    <h1>Notre réseau</h1>
    <p class="lead">El Djazair Idjar est représentée dans les agences bancaires de ses actionnaires, CPA et BADR, et dans quatre représentations régionales.</p>
  </div></section>
  <section class="sec"><div class="wrap reseau">
    <div class="carte-pts" id="carte-pts"><div class="mer"></div></div>
    <ul class="liste-reseau" id="liste"></ul>
  </div></section>
  <section class="sec sec--glacier"><div class="wrap" style="display:grid;gap:16px">
    <h2>Trouver l’interlocuteur le plus proche</h2>
    <form class="form" data-demo="Merci. La représentation la plus proche vous contacte (démonstration : rien n’est enregistré).">
      <div class="ligne2">
        <label>Votre wilaya<select id="wil" required><option value="">Choisir…</option></select></label>
        <label>Téléphone<input type="tel" required placeholder="05 00 00 00 00"></label>
      </div>
      <p id="proche" class="lead" style="font-size:16px"></p>
      <button class="btn btn--plein" type="submit">Être rappelé</button>
    </form>
  </div></section>
</main>
<script src="js/corporate.js"></script>
<script>
carteReseau(document.getElementById("carte-pts"));
document.getElementById("liste").innerHTML = EDI.reseau.map(r=>`<li><b>${r.v}</b><span>${r.r}</span></li>`).join("")
  + `<li><b>Sud</b><span>Représentation à venir</span></li>`;
const W={"Alger":[36.73,3.05],"Blida":[36.47,2.83],"Boumerdès":[36.76,3.47],"Tipaza":[36.59,2.45],"Médéa":[36.26,2.75],"Tizi Ouzou":[36.71,4.05],"Béjaïa":[36.75,5.08],"Bouira":[36.37,3.90],"Bordj Bou Arréridj":[36.07,4.76],"Sétif":[36.19,5.41],"Jijel":[36.82,5.77],"Mila":[36.45,6.26],"Constantine":[36.36,6.61],"Batna":[35.56,6.17],"Biskra":[34.85,5.73],"Khenchela":[35.44,7.14],"Oum El Bouaghi":[35.88,7.11],"Annaba":[36.90,7.76],"Skikda":[36.88,6.91],"Guelma":[36.46,7.43],"Tébessa":[35.40,8.12],"M’Sila":[35.70,4.54],"Chlef":[36.17,1.33],"Relizane":[35.74,0.56],"Mostaganem":[35.93,0.09],"Oran":[35.70,-0.63],"Aïn Témouchent":[35.30,-1.14],"Tlemcen":[34.88,-1.32],"Sidi Bel Abbès":[35.19,-0.63],"Mascara":[35.40,0.14],"Tiaret":[35.37,1.32],"Djelfa":[34.67,3.26],"Laghouat":[33.80,2.87],"Ouargla":[31.95,5.33],"Ghardaïa":[32.49,3.67]};
const sel=document.getElementById("wil");
Object.keys(W).sort((a,b)=>a.localeCompare(b,"fr")).forEach(w=>sel.insertAdjacentHTML("beforeend",`<option>${w}</option>`));
sel.addEventListener("change",()=>{
  const c=W[sel.value]; if(!c){document.getElementById("proche").textContent="";return}
  const d=r=>Math.hypot((r.lat-c[0])*111,(r.lon-c[1])*90);
  const best=[...EDI.reseau].sort((a,b)=>d(a)-d(b))[0];
  document.getElementById("proche").innerHTML=`Représentation la plus proche : <b>${best.v}</b>, à environ ${Math.round(d(best))} km. Vous pouvez aussi déposer votre demande dans toute agence CPA ou BADR.`;
});
</script></body></html>
